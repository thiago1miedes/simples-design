<!DOCTYPE html>
<html lang="pt-BR" class="pg-enter">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Admin · Simple Design</title>
<link rel="icon" href="assets/icons/logo_icon_01.png" type="image/png">
<link rel="apple-touch-icon" href="assets/icons/logo_icon_01.png">
<meta name="theme-color" content="#0C0C0E">
<meta name="robots" content="noindex, nofollow">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,300..800&family=Hanken+Grotesk:ital,wght@0,300..800;1,400..600&display=swap" rel="stylesheet">

<link href="fx.css" rel="stylesheet">
<link href="assets/css/admin.css" rel="stylesheet">
</head>
<body>

<!-- ============ LOGIN ============ -->
<section class="login" id="loginView">
  <form class="login-card" id="loginForm" novalidate>
    <div class="login-logo">
      <img src="assets/logo/logo_white_01.png" alt="Simple Design">
    </div>
    <h1>Painel Admin</h1>
    <p class="sub">Acesso restrito à equipe.</p>

    <div class="field">
      <label for="loginEmail">E-mail</label>
      <input class="input" type="email" id="loginEmail" autocomplete="email" required>
    </div>
    <div class="field">
      <label for="loginPass">Senha</label>
      <input class="input" type="password" id="loginPass" autocomplete="current-password" required>
    </div>

    <button type="submit" class="btn btn-primary" id="loginBtn">
      <span class="spinner" aria-hidden="true"></span>
      <span class="btn-label">Entrar</span>
    </button>

    <div class="login-error" id="loginError" role="alert">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="M12 8v4"/><path d="M12 16h.01"/></svg>
      <span id="loginErrorMsg">E-mail ou senha incorretos.</span>
    </div>
  </form>
</section>

<!-- ============ DASHBOARD ============ -->
<main class="dash" id="dashView">
  <header class="dash-header">
    <div class="brand">
      <img src="assets/logo/logo_white_01.png" alt="Simple Design">
    </div>
    <div style="display:flex;align-items:center;gap:1.2rem">
      <span class="greet">Olá, <b id="userName">—</b></span>
      <button class="btn-logout" id="logoutBtn">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="m16 17 5-5-5-5"/><path d="M21 12H9"/></svg>
        Sair
      </button>
    </div>
  </header>

  <div class="dash-body">
    <span class="eyebrow">Mensagens recebidas</span>
    <h2 class="dash-title">Caixa de entrada</h2>

    <div class="dash-controls">
      <div class="tabs" id="tabs">
        <button class="tab active" data-filter="all">Todos <span class="count" data-count="all">0</span></button>
        <button class="tab" data-filter="novo">Novo <span class="count" data-count="novo">0</span></button>
        <button class="tab" data-filter="em_analise">Em análise <span class="count" data-count="em_analise">0</span></button>
        <button class="tab" data-filter="respondido">Respondido <span class="count" data-count="respondido">0</span></button>
        <button class="tab" data-filter="arquivado">Arquivado <span class="count" data-count="arquivado">0</span></button>
      </div>
      <div class="search">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
        <input type="search" id="searchInput" placeholder="Buscar por nome, e-mail, empresa ou segmento…" aria-label="Buscar mensagens" autocomplete="off">
      </div>
    </div>

    <!-- skeletons -->
    <div class="cards-grid" id="skeletonGrid">
      <div class="skel-card"><div class="skel l1"></div><div class="skel l2"></div><div class="skel l3"></div><div class="skel l4"></div><div class="skel l5"></div></div>
      <div class="skel-card"><div class="skel l1"></div><div class="skel l2"></div><div class="skel l3"></div><div class="skel l4"></div><div class="skel l5"></div></div>
      <div class="skel-card"><div class="skel l1"></div><div class="skel l2"></div><div class="skel l3"></div><div class="skel l4"></div><div class="skel l5"></div></div>
    </div>

    <!-- cards reais -->
    <div class="cards-grid" id="cardsGrid" style="display:none"></div>

    <!-- estado vazio -->
    <div class="empty" id="emptyState" tabindex="-1">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M22 12h-6l-2 3h-4l-2-3H2"/><path d="M5.45 5.11 2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.45-6.89A2 2 0 0 0 16.76 4H7.24a2 2 0 0 0-1.79 1.11z"/></svg>
      <p id="emptyMsg">Nenhum briefing recebido ainda.</p>
    </div>
  </div>
</main>

<!-- ============ DRAWER — DETALHES DO BRIEFING ============ -->
<div class="drawer" id="drawer" hidden>
  <div class="drawer-overlay" id="drawerOverlay"></div>
  <aside class="drawer-panel" id="drawerPanel" role="dialog" aria-modal="true" aria-labelledby="drawerTitle" tabindex="-1">
    <div class="drawer-bar">
      <span class="eyebrow">Briefing</span>
      <span class="drawer-date" id="drawerDate"></span>
      <button type="button" class="drawer-close" id="drawerClose" aria-label="Fechar detalhes" title="Fechar (Esc)">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
      </button>
    </div>

    <div class="drawer-scroll" id="drawerScroll">
      <header class="drawer-head">
        <h2 class="drawer-title" id="drawerTitle">—</h2>
        <p class="drawer-sub" id="drawerSub"></p>
        <div class="drawer-badges" id="drawerBadges"></div>
        <div class="drawer-actions">
          <label class="drawer-status">
            <span class="st-dot" aria-hidden="true"></span>
            <span class="drawer-status-lbl">Status</span>
            <select class="status-select" id="drawerStatus"></select>
          </label>
          <div class="drawer-links" id="drawerLinks"></div>
        </div>
      </header>

      <div class="drawer-body" id="drawerBody"></div>
    </div>
  </aside>
</div>

<!-- ============ CONFIRMAÇÃO — EXCLUIR BRIEFING ============ -->
<div class="delete-modal" id="deleteModal" hidden>
  <div class="delete-overlay" id="deleteOverlay"></div>
  <section class="delete-dialog" id="deleteDialog" role="alertdialog" aria-modal="true" aria-labelledby="deleteTitle" aria-describedby="deleteMessage" tabindex="-1">
    <span class="delete-icon" aria-hidden="true">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M8 6V4h8v2"/><path d="m19 6-1 14H6L5 6"/><path d="M10 11v5M14 11v5"/></svg>
    </span>
    <h2 id="deleteTitle">Excluir briefing?</h2>
    <p id="deleteMessage">O briefing <strong id="deleteName">—</strong> será removido permanentemente do Supabase.</p>
    <p class="delete-files-info" id="deleteFilesInfo" hidden></p>
    <p class="delete-error" id="deleteError" role="alert" hidden></p>
    <p class="delete-progress" id="deleteProgress" role="status" aria-live="polite" hidden></p>
    <div class="delete-actions">
      <button type="button" class="delete-cancel" id="deleteCancel">Cancelar</button>
      <button type="button" class="delete-confirm" id="deleteConfirmButton">Excluir briefing</button>
    </div>
  </section>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="assets/js/supabase-config.js"></script>
<script src="assets/js/admin.js"></script>
<script src="fx.js"></script>
</body>
</html>
